- insert:
    - id: agent-memory
      name: "dsh-agent-vault"

# 接管 DSH 内置的团队任务工具。
#
# vault 的 team_task_create / team_task_list 与 @deepseek-ai/dsh-tool-agent-team
# 注册的工具同名。两个包同时激活时，后激活的一方在 apply 阶段失败（宿主日志
# 「N entry did not activate」），实际可用的工具集合取决于插件的激活顺序：
# 若内置包先激活，vault 的 team_task_assign/claim/report 等 9 个工具会静默消失。
#
# vault 的 bundle 层在 dsh-base / dsh-web-app 之后应用，这里显式停用内置工具包，
# 让团队工具唯一地来自 vault。内置的 agentTeams 服务（agent-team 包）与
# dsh-client-ui-agent-team 面板不受影响，仍可正常加载。
#
# 若宿主的基础层里没有这个 id（更旧或更简的 DSH 安装），DSH 会打印一条
# skipped 警告并跳过本项，不产生其他副作用。
- id: tool-agent-team
  disabled: true
